<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Skin—Clinic</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <div id="header"></div>

  <main class="auth">
    <form id="register-form" novalidate>
      <h1 class="form-title t-h2">Register</h1>
      <label class="field">
        <span class="field__label">Name</span>
        <input class="field__input" type="text" name="name" placeholder="Alex" autocomplete="given-name" maxlength="50" required>
      </label>
      <label class="field">
        <span class="field__label">Surname</span>
        <input class="field__input" type="text" name="surname" placeholder="Adams" autocomplete="family-name" maxlength="50" required>
      </label>
      <label class="field">
        <span class="field__label">Email</span>
        <input class="field__input" type="email" name="email" placeholder="Email" autocomplete="email" required>
      </label>
      <label class="field">
        <span class="field__label">Phone</span>
        <input class="field__input" type="tel" name="phone" placeholder="+998" autocomplete="tel" required>
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <input class="field__input" type="password" name="password" placeholder="Your password" autocomplete="new-password" minlength="4" maxlength="64" required>
      </label>
      <label class="field">
        <span class="field__label">Repeat your password</span>
        <input class="field__input" type="password" name="password2" placeholder="Your password" autocomplete="new-password" required>
      </label>
      <button class="btn-form" type="submit">Register</button>
      <p class="form-error" id="form-error"></p>
      <p class="form-alt">Already have an account? <a href="login.html" id="to-login">Log In</a></p>
    </form>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
